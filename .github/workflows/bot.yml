name: Bot 24/7

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create .env from secrets
        working-directory: bot
        run: |
          cat > .env <<EOF
          TOKEN=${{ secrets.TOKEN }}
          brand_name=${{ secrets.BRAND_NAME }}
          OWNER_IDS=${{ secrets.OWNER_IDS }}
          API_ENABLED=false
          TUNNEL_ENABLED=false
          DASHBOARD_API_KEY=${{ secrets.DASHBOARD_API_KEY }}
          CMD_WEBHOOK_URL=${{ secrets.CMD_WEBHOOK_URL }}
          EMOJI_SYNC=false
          EOF

      - name: Install dependencies
        working-directory: bot
        run: pip install --quiet -r requirements.txt

      - name: Run bot
        working-directory: bot
        run: python CodeX.py
